services:
  openchat:
    build: .
    ports:
      - "3001:3001"
    environment:
      OPENCHAT_PORT: "3001"
      OPENCHAT_CWD: /workspace
    volumes:
      # Project the agent can read/write
      - ./:/workspace
      # Persist sessions, skills, plugins, config
      - openchat-data:/root/.openchat
    working_dir: /app
    restart: unless-stopped

volumes:
  openchat-data:
